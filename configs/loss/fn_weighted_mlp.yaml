# configs/loss/fn_weighted_mlp.yaml
# Stage 6: SimCLR InfoNCE with false-negative downweighting from a paired
# scorer (R6 — all hyperparams come from this YAML).
#
# Param-parity note (R1): the MLP pair scorer at hidden_dim=32, num_layers=2
# with input_dim=128 carries ~9.3K params; the KAN scorer in Stage 7 must
# stay within ±15 % of this footprint to validate H3.

_target_: src.losses.FNWeightedInfoNCELoss
# `name` is informational metadata for probe-row tagging (popped before the
# loss is instantiated, never passed as a kwarg). Routes probe.py's
# baseline_family to "false_negative_aware_method".
name: fn_weighted
temperature: 0.1
normalize_embeddings: true
# Cap on p_fn. 0.5 = floor of 0.5 on negative weights, preventing the
# scorer from completely removing negatives (Pitfall #3: p_FN collapse).
# Setting this to 1.0 allows full removal and risks denominator collapse.
max_fn_weight: 0.5

# Pitfall #5 saturation regularization (raw-p_fn penalties; see
# src.losses.pfn_diagnostics.pfn_regularization). Defaults are conservative;
# set lambda_mean=0 lambda_cap=0 to recover Stage-6-pre-fix behavior.
pfn_regularization:
  enabled: true
  target_mean: 0.05        # prior expectation on the FN rate per pair
  lambda_mean: 0.1         # weight on (mean_p_fn - target)^2
  lambda_cap: 0.1          # weight on relu(p_fn/max_cap - cap_margin)^2
  lambda_entropy: 0.0      # logged-only by default; enable to fight collapse
  cap_margin: 0.98

# Per-epoch warmup/ramp on the effective max_fn_weight. With warmup_epochs=5
# the loss runs as plain InfoNCE for the first 5 epochs (max_fn_weight=0)
# and then linearly ramps to max_fn_weight_end over `ramp_epochs`.
fn_schedule:
  enabled: true
  warmup_epochs: 5
  ramp_epochs: 10
  max_fn_weight_start: 0.0
  max_fn_weight_end: 0.5

# configs/loss/fn_weighted_mlp.yaml
# Stage 6: SimCLR InfoNCE with false-negative downweighting from a paired
# scorer (R6 — all hyperparams come from this YAML).
#
# Param-parity note (R1): the MLP pair scorer at hidden_dim=32, num_layers=2
# with input_dim=128 carries ~9.3K params; the KAN scorer in Stage 7 must
# stay within ±15 % of this footprint to validate H3.

_target_: src.losses.FNWeightedInfoNCELoss
temperature: 0.1
normalize_embeddings: true
# Cap on p_fn. 0.5 = floor of 0.5 on negative weights, preventing the
# scorer from completely removing negatives (Pitfall #3: p_FN collapse).
# Setting this to 1.0 allows full removal and risks denominator collapse.
max_fn_weight: 0.5

# configs/loss/edge_aware.yaml
# Stage 7.5 loss: Edge-aware FN-weighted InfoNCE. Lambdas default to 0 so this
# loss is numerically identical to Stage 7 unless the experiment explicitly
# turns the aux terms on.
#
# Marker `edge_aware: true` tells `scripts/train/train_edge.py` to compute edge
# fingerprints and forward them to the scorer + loss.

_target_: src.losses.EdgeAwareFNWeightedInfoNCELoss
# `name` is informational metadata for probe-row tagging (popped before the
# loss is instantiated, never passed as a kwarg). Routes probe.py's
# baseline_family to "false_negative_aware_method".
name: edge_aware_fn
temperature: 0.1
normalize_embeddings: true
max_fn_weight: 0.5      # cap FN trivial-optimum reward (Pitfall #5 mitigation)
lambda_edge: 0.0
tau_edge: 0.1
lambda_edge_align: 0.0

# Pitfall #5 saturation regularization (forwarded to the inner FN loss).
pfn_regularization:
  enabled: true
  target_mean: 0.05
  lambda_mean: 0.1
  lambda_cap: 0.1
  lambda_entropy: 0.0
  cap_margin: 0.98

# Warmup/ramp schedule on max_fn_weight. With warmup_epochs=5 the FN
# downweighting is OFF (InfoNCE-equivalent) for the first 5 epochs.
fn_schedule:
  enabled: true
  warmup_epochs: 5
  ramp_epochs: 10
  max_fn_weight_start: 0.0
  max_fn_weight_end: 0.5

edge_aware: true

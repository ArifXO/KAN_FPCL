# configs/model/residual_fastkan_warp.yaml
# Stage 5 ResidualKAN: MLP projector (512->128) + residual KAN warp (128->128).
# Output is 128-D, matching MLP and FastKAN heads for a fair H1 comparison
# (previously the warp ran on raw 512-D encoder output, leaving Cell 3's probe
# on 512-D features and confounding the geometry comparison).
#
# R1 parity (verified by instantiation, see param_count check):
#   MLP projector: MLPHead(512, 512, 128, BN)        = 329,344 params
#   Warp: ResidualFastKANWarp(128, hidden=16, c=8)   =  37,267 params
#   Total head                                       = 366,611 params
#   vs MLP baseline 329,344 = +11.32% (within +-15%).

encoder:
  _target_: src.models.ResNet18Encoder
  pretrained: false

head:
  _target_: src.models.ProjectorWithWarp
  projector:
    _target_: src.models.MLPHead
    in_dim: 512
    hidden_dim: 512
    output_dim: 128
    use_batch_norm: true
    l2_normalize: false    # warp does its own normalization
  warp:
    _target_: src.models.kan.ResidualFastKANWarp
    input_dim: 128
    hidden_dim: 16
    num_centers: 8
    grid_min: -2.0
    grid_max: 2.0
    use_base_linear: true
    base_activation: silu
    rbf_init_scale: 0.1
    alpha_init: 0.0
    learnable_alpha: true
    clamp_alpha: true
    clamp_max: 0.2

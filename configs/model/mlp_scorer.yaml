# configs/model/mlp_scorer.yaml
# Stage 6 model bundle: ResNet-18 encoder + MLP projection head + MLP pair scorer.
# Param count (scorer only @ input_dim=128, hidden=32, layers=2): ~9.3K
# (R1 anchor — the KAN scorer in Stage 7 must land within ±15 % of this.)

encoder:
  _target_: src.models.ResNet18Encoder
  pretrained: false

head:
  _target_: src.models.MLPHead
  in_dim: 512
  hidden_dim: 512
  output_dim: 128
  use_batch_norm: true
  l2_normalize: true

scorer:
  _target_: src.models.MLPPairScorer
  input_dim: 128
  hidden_dim: 32
  num_layers: 2
  # Pitfall #5: initialise final-layer bias to logit(0.05) so mean p_fn
  # starts near 0.05 instead of the saturation-prone 0.5.
  init_pfn_prior: 0.05
  # Detach z at the scorer boundary so scorer gradients cannot reshape the
  # encoder/projector toward easy-to-downweight features.
  detach_inputs: true

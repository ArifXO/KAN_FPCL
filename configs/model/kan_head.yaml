# configs/model/kan_head.yaml
# Stage 4 FastKAN projector: ResNet-18 encoder + FastKAN projection head.
# R1 parity: MLP head @ 512->512->128 with BN = 329,344 trainable params.
# FastKAN head @ 512->57->128, 8 centers, base linear = 328,507 params.
# Difference: -0.25% (within +-15%).

encoder:
  _target_: src.models.ResNet18Encoder
  pretrained: false

head:
  _target_: src.models.kan.FastKANProjector
  input_dim: 512
  hidden_dim: 57
  output_dim: 128
  num_centers: 8
  grid_min: -2.0
  grid_max: 2.0
  use_base_linear: true
  base_activation: silu
  rbf_init_scale: 0.1
  normalize: true

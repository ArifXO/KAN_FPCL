# configs/model/mlp_head_kan_scorer.yaml
# H3 model bundle: ResNet-18 encoder + MLP projection head + KAN pair scorer.
# Same encoder/head as mlp_scorer.yaml; scorer swapped to KANPairScorer so H3
# compares KAN vs MLP scorer at matched param count (R1).
#
# R1 parity (input_dim=128):
#   MLPPairScorer anchor:  9,313 params  (hidden=32, num_layers=2)
#   KANPairScorer:         8,972 params  (hidden=5, centers=6)  -> 3.7% << 15%

encoder:
  _target_: src.models.ResNet18Encoder
  pretrained: false

head:
  _target_: src.models.MLPHead
  in_dim: 512
  hidden_dim: 512
  output_dim: 128
  use_batch_norm: true
  l2_normalize: true

scorer:
  _target_: src.models.KANPairScorer
  input_dim: 128
  hidden_dim: 5
  num_centers: 6
  use_base_linear: true
  init_pfn_prior: 0.05      # Pitfall #5: low-prior bias init
  detach_inputs: true       # block scorer->encoder grad path

# configs/experiment/ablation.yaml
# Stage 10: cell × seed ablation matrix orchestrated by scripts/ablate.py.
#
# LABEL VERIFICATION (check these match actual model configs):
# Cell 1 mlp_infonce       -> mlp_baseline.yaml           -> MLPHead                            ✓
# Cell 2 kan_infonce        -> kan_head.yaml                -> FastKANProjector                   ✓
# Cell 3 reskan_infonce     -> residual_fastkan_warp        -> ResidualFastKANWarp                ✓
# Cell 4 mlp_fn_mlp         -> mlp_scorer.yaml              -> MLPHead + MLPPairScorer            ✓
# Cell 5 mlp_fn_kan         -> kan_scorer.yaml               -> MLPHead + KANPairScorer            ✓
# Cell 6 kan_fn_kan         -> kan_head_with_kan_scorer     -> FastKANProjector + KANPairScorer   ✓
# Cell 7 edge_scorer_no_aux -> edge_aware_mlp.yaml          -> FastKANProjector + EdgeAwareMLP    ✓
# Cell 8 edge_contrastive   -> edge_aware_mlp.yaml          -> FastKANProjector + EdgeAwareMLP    ✓
# Cell 9 edge_align         -> edge_aware_mlp.yaml          -> FastKANProjector + EdgeAwareMLP    ✓
# Cell 10 zonly_fn          -> edge_aware_mlp_zonly.yaml    -> FastKANProjector + EdgeAwareMLP(z-only) ✓
# Cell 11 edge_contrastive_kan -> full_edge_l005_kan_scorer -> FastKANProjector + EdgeAwareKAN(λ=0.05) ✓
# Each cell triggers: train -> probe -> analyze_geometry, with one merged
# row appended to ablation_master.csv. Per-step intermediate CSVs are kept
# under runs/results/_ablate_*.csv so a re-run is recoverable (R8).
#
# To add a cell: append an entry to `cells` with:
#   - cell_id            : unique snake_case label used in CSV + checkpoint run name
#   - train_script       : python module path (e.g. scripts.train, scripts.train_fn,
#                          scripts.train_edge)
#   - train_config       : one of the full_*.yaml experiment configs
#   - head / loss / scorer / lambda_edge / lambda_edge_align: CSV label fields
#   - dataset            : label only (chestmnist | chexpert)
#   - overrides          : extra Hydra overrides forwarded to the train script
#                          (seed is injected by ablate.py; do NOT add seed here)
#
# CLAUDE.md R6 compliance: lambdas live in `overrides`, NOT hardcoded in the
# train script. The duplicate label fields let downstream analysis group rows
# without re-parsing override strings.
#
# CheXpert cells are NOT included here — ChestMNIST only per CLAUDE.md §Dataset Scope.

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

ablate:
  output_csv: runs/results/ablation_master.csv
  probe_csv: runs/results/_ablate_probe.csv
  geometry_csv: runs/results/_ablate_geometry.csv

  seeds: [42, 1337, 2024]

  cells:
    # ── H1: Architecture hypothesis (KAN projector vs MLP projector) ──────────

    # Cell 1 — H1 baseline: MLP projector + plain InfoNCE, no scorer.
    - cell_id: mlp_infonce
      hypothesis: h1
      train_script: scripts.train
      train_config: full_mlp_infonce
      head: mlp
      loss: infonce
      scorer: none
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # Cell 2 — H1: FastKAN projector + plain InfoNCE, no scorer.
    - cell_id: kan_infonce
      hypothesis: h1
      train_script: scripts.train
      train_config: full_kan_infonce
      head: fastkan
      loss: infonce
      scorer: none
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # Cell 3 — H1: Residual FastKAN projector + plain InfoNCE, no scorer.
    - cell_id: reskan_infonce
      hypothesis: h1
      train_script: scripts.train
      train_config: full_reskan_infonce
      head: residual_fastkan
      loss: infonce
      scorer: none
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # ── H2: FN-weighted loss hypothesis ──────────────────────────────────────

    # Cell 4 — H2: MLP projector + FN-weighted InfoNCE + MLP pair scorer.
    - cell_id: mlp_fn_mlp
      hypothesis: h2
      train_script: scripts.train_fn
      train_config: full_mlp_fn_mlp
      head: mlp
      loss: fn_weighted
      scorer: mlp
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # ── H3: KAN pair scorer hypothesis ───────────────────────────────────────

    # Cell 5 — H3: MLP projector + FN-weighted InfoNCE + KAN pair scorer.
    - cell_id: mlp_fn_kan
      hypothesis: h3
      train_script: scripts.train_fn
      train_config: full_mlp_fn_kan
      head: mlp
      loss: fn_weighted
      scorer: kan
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # Cell 6 — H3+H1: FastKAN projector + FN-weighted + KAN scorer.
    - cell_id: kan_fn_kan
      hypothesis: h3
      train_script: scripts.train_fn
      train_config: full_reskan_fn_kan
      head: fastkan
      loss: fn_weighted
      scorer: kan
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides: []

    # ── H4: Edge signal hypothesis ────────────────────────────────────────────
    # H4 decomposition (4 rows):
    #   Cell 10: zonly_fn                — scorer sees z-features ONLY (true baseline)
    #   Cell 7:  edge_scorer_no_aux      — scorer sees z + edge features, λ=0 (feature effect)
    #   Cell 8:  edge_contrastive        — scorer sees z + edge features, λ_edge=0.05 (MLP scorer)
    #   Cell 9:  edge_align              — scorer sees z + edge features, λ_edge_align=0.05
    # H3 cross-check (1 row):
    #   Cell 11: edge_contrastive_kan    — same as Cell 8 but KAN scorer (isolates scorer arch)

    # Cell 7 — H4 control: edge wiring ON, both lambdas=0.
    # Any delta vs zonly_fn comes from richer pair features (edge in scorer), not aux losses.
    - cell_id: edge_scorer_no_aux
      hypothesis: h4
      train_script: scripts.train_edge
      train_config: full_edge_scorer_no_aux
      head: fastkan
      loss: edge_aware_fn
      scorer: edge_mlp
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - loss.lambda_edge=0.0
        - loss.lambda_edge_align=0.0

    # Cell 8 — H4 treatment A: edge contrastive aux ON (lambda_edge=0.05).
    - cell_id: edge_contrastive
      hypothesis: h4
      train_script: scripts.train_edge
      train_config: full_edge_l005
      head: fastkan
      loss: edge_aware_fn
      scorer: edge_mlp
      lambda_edge: 0.05
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - loss.lambda_edge=0.05
        - loss.lambda_edge_align=0.0

    # Cell 9 — H4 treatment B: edge-align aux ON (lambda_edge_align=0.05).
    - cell_id: edge_align
      hypothesis: h4
      train_script: scripts.train_edge
      train_config: full_edge_align_l005
      head: fastkan
      loss: edge_aware_fn
      scorer: edge_mlp
      lambda_edge: 0.0
      lambda_edge_align: 0.05
      dataset: chestmnist
      overrides:
        - loss.lambda_edge=0.0
        - loss.lambda_edge_align=0.05

    # Cell 10 — H4 true z-only baseline: no edge features in scorer.
    # This is the REAL baseline for H4. Cells 7-9 all have edge features;
    # comparing them against this cell isolates the edge-signal contribution.
    - cell_id: zonly_fn
      hypothesis: h4
      train_script: scripts.train_edge
      train_config: full_zonly_fn
      head: fastkan
      loss: edge_aware_fn
      scorer: mlp_zonly
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - loss.lambda_edge=0.0
        - loss.lambda_edge_align=0.0

    # ── H3 cross-check: KAN scorer vs MLP scorer under edge-contrastive aux ───
    # Cell 11 — H3 cross-check: edge + KAN scorer + lambda_edge=0.05.
    # Compare vs Cell 8 (edge_contrastive, MLP scorer, λ_edge=0.05) to isolate
    # whether H4 gains come from edge features or from KAN scorer architecture.
    - cell_id: edge_contrastive_kan
      hypothesis: h3_cross
      train_script: scripts.train_edge
      train_config: full_edge_l005_kan_scorer
      head: fastkan
      loss: edge_aware_fn
      scorer: edge_kan
      lambda_edge: 0.05
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - loss.lambda_edge=0.05
        - loss.lambda_edge_align=0.0

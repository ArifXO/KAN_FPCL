# configs/experiment/ablation_debug.yaml
# Debug ablation: 3 cells x 1 seed = 3 rows. Verifies end-to-end pipeline
# (train -> probe -> geometry -> tables) without running the full 33-row matrix.
# AUROC numbers at 50 steps are meaningless — correctness, not performance, is the goal.

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

ablate:
  output_csv: runs/results/_debug_ablation_master.csv
  probe_csv: runs/results/_debug_probe.csv
  geometry_csv: runs/results/_debug_geometry.csv

  seeds: [42]

  cells:
    # One cell from each critical hypothesis path.

    # H1 baseline: MLP projector + plain InfoNCE.
    - cell_id: mlp_infonce
      hypothesis: h1
      train_script: scripts.train
      train_config: full_mlp_infonce
      head: mlp
      loss: infonce
      scorer: none
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - run.device=cpu
        - train.max_steps=50
        - data.batch_size=32
        - train.val_every=25
        - train.log_every=10

    # H3: MLP projector + FN-weighted InfoNCE + KAN pair scorer.
    - cell_id: mlp_fn_kan
      hypothesis: h3
      train_script: scripts.train_fn
      train_config: full_mlp_fn_kan
      head: mlp
      loss: fn_weighted
      scorer: kan
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - run.device=cpu
        - train.max_steps=50
        - data.batch_size=32
        - train.val_every=25
        - train.log_every=10

    # H4 treatment A: edge contrastive auxiliary ON (lambda_edge=0.05).
    - cell_id: edge_contrastive
      hypothesis: h4
      train_script: scripts.train_edge
      train_config: full_edge_l005
      head: fastkan
      loss: edge_aware_fn
      scorer: edge_mlp
      lambda_edge: 0.05
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - run.device=cpu
        - train.max_steps=50
        - data.batch_size=32
        - train.val_every=25
        - train.log_every=10
        - loss.lambda_edge=0.05
        - loss.lambda_edge_align=0.0

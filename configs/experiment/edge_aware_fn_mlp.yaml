# configs/experiment/edge_aware_fn_mlp.yaml
# Stage 7.5 full training (MLP scorer head, edge-aware features ON, lambdas 0).
# This is the H4 *control*: enables the wiring but disables the auxiliary
# losses so any AUROC delta vs Stage 7 must come from the richer pair
# features alone. Bump lambdas in a follow-up run to activate H4.

defaults:
  - _self_
  - /data: chestmnist
  - /model: edge_aware_mlp
  - /loss: edge_aware

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: edge_aware_fn_mlp
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu

train:
  max_steps: 200
  log_every: 10
  lr: 0.001

data:
  batch_size: 8
  num_workers: 0
  download: false

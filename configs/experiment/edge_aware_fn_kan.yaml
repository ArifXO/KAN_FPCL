# configs/experiment/edge_aware_fn_kan.yaml
# Stage 7.5 full training (KAN scorer head). Counterpart of edge_aware_fn_mlp.
# R1 parity: scorer parameter count must lie within ±15% of the MLP scorer
# anchor (~4,465). num_centers in /model/edge_aware_kan.yaml is the knob.

defaults:
  - _self_
  - /data: chestmnist
  - /model: edge_aware_kan
  - /loss: edge_aware

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: edge_aware_fn_kan
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu

train:
  max_steps: 200
  log_every: 10
  lr: 0.001

data:
  batch_size: 8
  num_workers: 0
  download: false

# configs/experiment/full_kan_infonce.yaml
# H1: FastKAN projector, plain InfoNCE. No scorer.
# Paired with full_mlp_infonce for H1 geometry comparison.
# Param check: FastKANProjector must be within ±15% of MLPHead (R1).

defaults:
  - _self_
  - /data: chestmnist
  - /model: kan_head
  - /loss: infonce

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: full_kan_infonce
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null

data:
  batch_size: 256
  num_workers: 4
  download: false

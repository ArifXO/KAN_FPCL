# configs/experiment/ablation_1seed_2step.yaml
# Timing-only ablation config: one seed, full matrix, two training steps per cell.

defaults:
  - ablation_1seed
  - _self_

ablate:
  output_csv: runs/results/_ablate_1seed_2step_master.csv
  probe_csv: runs/results/_ablate_1seed_2step_probe.csv
  geometry_csv: runs/results/_ablate_1seed_2step_geometry.csv
  global_overrides:
    - train.max_steps=2

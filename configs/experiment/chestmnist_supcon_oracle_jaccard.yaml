# configs/experiment/chestmnist_supcon_oracle_jaccard.yaml
# ChestMNIST SupCon Oracle (Jaccard) — ORACLE/UPPER-BOUND.
# Uses ChestMNIST labels during contrastive pre-training (Jaccard-weighted
# positives). Tag oracle clearly in the probe row.

defaults:
  - /data: chestmnist
  - /model: mlp_baseline
  - /loss: supcon_oracle_jaccard
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: chestmnist_supcon_oracle_jaccard
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null

data:
  batch_size: 256
  num_workers: 4
  download: false

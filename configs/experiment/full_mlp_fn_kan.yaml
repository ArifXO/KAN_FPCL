# configs/experiment/full_mlp_fn_kan.yaml
# H3: MLP projector + FN-weighted InfoNCE + KAN pair scorer.
# H3 comparison: KANPairScorer vs MLPPairScorer at matched param count (R1).

defaults:
  - /data: chestmnist
  - /model: mlp_head_kan_scorer
  - /loss: fn_weighted_mlp
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: full_mlp_fn_kan
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null
  lambda_pfn_reg: 0.01

data:
  batch_size: 256
  num_workers: 4
  download: false

# configs/experiment/ablation_smoke.yaml
# 1-cell × 1-seed smoke for scripts/ablate.py. Run name prefixed `smoke_`
# so probe/geometry rows are filterable per CLAUDE.md.

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

ablate:
  output_csv: runs/results/_ablate_smoke_master.csv
  probe_csv: runs/results/_ablate_smoke_probe.csv
  geometry_csv: runs/results/_ablate_smoke_geometry.csv

  seeds: [42]

  cells:
    - cell_id: smoke_mlp_infonce
      train_script: scripts.train
      train_config: smoke_mlp
      head: mlp
      loss: infonce
      scorer: none
      lambda_edge: 0.0
      lambda_edge_align: 0.0
      dataset: chestmnist
      overrides:
        - train.max_steps=2
        - data.batch_size=4

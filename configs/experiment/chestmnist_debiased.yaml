# configs/experiment/chestmnist_debiased.yaml
# ChestMNIST Debiased CL baseline (label-free). Mirrors full_mlp_infonce for
# encoder/projector/training budget so the row is directly comparable.

defaults:
  - /data: chestmnist
  - /model: mlp_baseline
  - /loss: debiased
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: chestmnist_debiased
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null

data:
  batch_size: 256
  num_workers: 4
  download: false

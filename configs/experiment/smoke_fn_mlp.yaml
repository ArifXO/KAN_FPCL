# configs/experiment/smoke_fn_mlp.yaml
# Stage 6 smoke run — verifies the full FN-weighted pipeline executes
# end-to-end and writes the R8 artifact set. Not a real training run.

defaults:
  - /data: chestmnist
  - /model: mlp_scorer
  - /loss: fn_weighted_mlp
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: smoke_fn_mlp
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 5
  log_every: 1
  lr: 0.001
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 2          # smoke: validate often on the tiny step budget
  val_max_batches: 2    # cap val cost on the large ChestMNIST val split

data:
  batch_size: 4
  num_workers: 0
  download: false

# configs/experiment/smoke_mlp.yaml
# Stage 2 smoke run — verifies the full pipeline executes end-to-end with
# the R8 artifact set written. Not a real training run.

defaults:
  - _self_
  - /data: chestmnist
  - /model: mlp_baseline
  - /loss: infonce

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: smoke_mlp
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu

train:
  max_steps: 5
  log_every: 1
  lr: 0.001

data:
  batch_size: 4
  num_workers: 0
  download: false

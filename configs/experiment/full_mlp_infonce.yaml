# configs/experiment/full_mlp_infonce.yaml
# H1 baseline: MLP projector, plain InfoNCE. No scorer.
# Param reference: MLPHead(512→512→128) ≈ 329K head params (R1 anchor).

defaults:
  - _self_
  - /data: chestmnist
  - /model: mlp_baseline
  - /loss: infonce

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: full_mlp_infonce
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null

data:
  batch_size: 256
  num_workers: 4
  download: false

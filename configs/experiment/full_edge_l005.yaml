# configs/experiment/full_edge_l005.yaml
# H4 treatment A: edge contrastive auxiliary ON (lambda_edge=0.05).
# Primary H4 claim: edge fingerprint InfoNCE helps beyond z-only.

defaults:
  - _self_
  - /data: chestmnist
  - /model: edge_aware_mlp
  - /loss: edge_aware

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: full_edge_l005
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null
  lambda_pfn_reg: 0.01

data:
  batch_size: 256
  num_workers: 4
  download: false

loss:
  lambda_edge: 0.05
  lambda_edge_align: 0.0

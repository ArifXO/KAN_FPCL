# configs/experiment/full_edge_scorer_no_aux.yaml
# H4 control: edge wiring fully ON, but both lambdas = 0.
# Any AUROC delta vs full_reskan_fn_kan comes from richer pair features,
# NOT from the auxiliary edge losses. Isolates scorer feature effect.
# (Formerly full_edge_off.yaml — renamed: "edge_off" implied edge wiring
# was disabled, but use_edge_features=true; only the aux losses are zeroed.)

defaults:
  - _self_
  - /data: chestmnist
  - /model: edge_aware_mlp
  - /loss: edge_aware

hydra:
  searchpath:
    - file://${oc.env:PROJECT_ROOT}/configs

run:
  name: full_edge_scorer_no_aux
  output_root: runs
  seed: 42
  deterministic: false
  device: cuda

train:
  max_steps: 10000
  log_every: 100
  lr: 3.0e-4
  lr_min: 1.0e-6
  grad_clip: 1.0
  val_every: 500
  val_max_batches: null
  lambda_pfn_reg: 0.01

data:
  batch_size: 256
  num_workers: 4
  download: false

loss:
  lambda_edge: 0.0
  lambda_edge_align: 0.0

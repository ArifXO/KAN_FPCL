run:
  name: smoke_residual_fastkan_warp
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu
train:
  max_steps: 5
  log_every: 1
  lr: 0.001
data:
  batch_size: 256
  num_workers: 0
  download: false
  _target_: src.data.ChestMNISTDataset
  size: 28
  pin_memory: false
  split_seed: 42
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  augmentation:
    crop_scale_min: 0.6
    crop_scale_max: 1.0
    rotation_degrees: 15
    brightness: 0.3
    contrast: 0.3
    horizontal_flip_prob: 0.5
model:
  encoder:
    _target_: src.models.ResNet18Encoder
    pretrained: false
  head:
    _target_: src.models.kan.ResidualFastKANWarp
    input_dim: 512
    hidden_dim: 36
    num_centers: 8
    grid_min: -2.0
    grid_max: 2.0
    use_base_linear: true
    base_activation: silu
    rbf_init_scale: 0.1
    alpha_init: 0.0
    learnable_alpha: true
    clamp_alpha: true
    clamp_max: 0.2
loss:
  _target_: src.losses.InfoNCELoss
  temperature: 0.1
  normalize_embeddings: true

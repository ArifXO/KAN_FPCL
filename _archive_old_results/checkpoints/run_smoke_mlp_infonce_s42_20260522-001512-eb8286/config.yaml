run:
  name: smoke_mlp_infonce_s42
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu
train:
  max_steps: 2
  log_every: 1
  lr: 0.001
data:
  batch_size: 4
  num_workers: 0
  download: true
  _target_: src.data.ChestMNISTDataset
  size: 28
  pin_memory: false
  split_seed: 42
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  augmentation:
    crop_scale_min: 0.6
    crop_scale_max: 1.0
    rotation_degrees: 15
    brightness: 0.3
    contrast: 0.3
    horizontal_flip_prob: 0.5
model:
  encoder:
    _target_: src.models.ResNet18Encoder
    pretrained: false
  head:
    _target_: src.models.MLPHead
    in_dim: 512
    hidden_dim: 512
    output_dim: 128
    use_batch_norm: true
    l2_normalize: true
loss:
  _target_: src.losses.InfoNCELoss
  temperature: 0.1
  normalize_embeddings: true

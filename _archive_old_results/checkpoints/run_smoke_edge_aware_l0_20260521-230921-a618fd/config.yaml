run:
  name: smoke_edge_aware_l0
  output_root: checkpoints
  seed: 42
  deterministic: false
  device: cpu
train:
  max_steps: 5
  log_every: 1
  lr: 0.001
data:
  batch_size: 256
  num_workers: 0
  download: true
  _target_: src.data.ChestMNISTDataset
  size: 28
  pin_memory: false
  split_seed: 42
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  augmentation:
    crop_scale_min: 0.6
    crop_scale_max: 1.0
    rotation_degrees: 15
    brightness: 0.3
    contrast: 0.3
    horizontal_flip_prob: 0.5
model:
  encoder:
    _target_: src.models.ResNet18Encoder
    pretrained: false
  head:
    _target_: src.models.kan.FastKANProjector
    input_dim: 512
    hidden_dim: 64
    output_dim: 128
    num_centers: 8
    grid_min: -2.0
    grid_max: 2.0
    use_base_linear: true
    base_activation: silu
    rbf_init_scale: 0.1
    normalize: true
  scorer:
    _target_: src.models.EdgeAwarePairScorer
    input_dim: 128
    edge_dim: 256
    hidden_dim: 16
    num_layers: 2
    activation: relu
    use_edge_features: true
    scorer_type: mlp
loss:
  _target_: src.losses.EdgeAwareFNWeightedInfoNCELoss
  temperature: 0.1
  normalize_embeddings: true
  max_fn_weight: 0.5
  lambda_edge: 0.0
  tau_edge: 0.1
  lambda_edge_align: 0.0
  edge_aware: true

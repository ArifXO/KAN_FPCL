data:
  _target_: src.data.ChestMNISTDataset
  name: chestmnist
  size: 28
  batch_size: 4
  num_workers: 0
  pin_memory: false
  download: false
  split_seed: 42
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  augmentation:
    crop_scale_min: 0.6
    crop_scale_max: 1.0
    rotation_degrees: 15
    brightness: 0.3
    contrast: 0.3
    horizontal_flip_prob: 0.5
model:
  encoder:
    _target_: src.models.ResNet18Encoder
    pretrained: false
  head:
    _target_: src.models.MLPHead
    in_dim: 512
    hidden_dim: 512
    output_dim: 128
    use_batch_norm: true
    l2_normalize: true
  scorer:
    _target_: src.models.MLPPairScorer
    input_dim: 128
    hidden_dim: 32
    num_layers: 2
    init_pfn_prior: 0.05
    detach_inputs: true
loss:
  _target_: src.losses.FNWeightedInfoNCELoss
  temperature: 0.1
  normalize_embeddings: true
  max_fn_weight: 0.5
  pfn_regularization:
    enabled: true
    target_mean: 0.05
    lambda_mean: 0.1
    lambda_cap: 0.1
    lambda_entropy: 0.0
    cap_margin: 0.98
  fn_schedule:
    enabled: true
    warmup_epochs: 5
    ramp_epochs: 10
    max_fn_weight_start: 0.0
    max_fn_weight_end: 0.5
run:
  name: smoke_fn_mlp
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cpu
train:
  max_steps: 2
  log_every: 1
  lr: 0.001
  lr_min: 1.0e-06
  grad_clip: 1.0
  val_every: 2
  val_max_batches: 1

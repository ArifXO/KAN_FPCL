data:
  _target_: src.data.ChestMNISTDataset
  name: chestmnist
  size: 28
  batch_size: 4
  num_workers: 0
  pin_memory: false
  download: false
  split_seed: 42
  normalize:
    mean:
    - 0.5
    std:
    - 0.5
  augmentation:
    crop_scale_min: 0.6
    crop_scale_max: 1.0
    rotation_degrees: 15
    brightness: 0.3
    contrast: 0.3
    horizontal_flip_prob: 0.5
model:
  encoder:
    _target_: src.models.ResNet18Encoder
    pretrained: false
  head:
    _target_: src.models.MLPHead
    in_dim: 512
    hidden_dim: 512
    output_dim: 128
    use_batch_norm: true
    l2_normalize: true
loss:
  _target_: src.losses.DebiasedContrastiveLoss
  name: debiased
  temperature: 0.5
  tau_plus: 0.1
  normalize_embeddings: true
  estimator_clip_min: 1.0e-08
run:
  name: smoke_debiased
  output_root: runs/checkpoints
  seed: 42
  deterministic: false
  device: cpu
train:
  max_steps: 2
  log_every: 1
  lr: 0.001
  lr_min: 1.0e-06
  grad_clip: 1.0
  val_every: 2
  val_max_batches: 1
